# mekesh.work.gd — TikTok Cliper + Stripe webhook
# Serves the app on standard HTTPS (443). Keeps :8001 as a compatibility
# proxy so existing Google/TikTok OAuth callbacks with :8001 still work
# until those portals are updated.

# HTTP → HTTPS redirect (+ ACME + Stripe webhook)
server {
    listen 80;
    listen [::]:80;
    server_name mekesh.work.gd;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /stripe/webhook {
        proxy_pass http://127.0.0.1:8765/stripe/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Primary HTTPS site (no port in URL)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mekesh.work.gd;

    ssl_certificate /etc/letsencrypt/live/mekesh.work.gd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mekesh.work.gd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 500M;

    location /stripe/webhook {
        proxy_pass http://127.0.0.1:8765/stripe/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}

# Legacy :8001 — still serves the app so old OAuth redirect URIs keep working.
# Prefer bookmarking https://mekesh.work.gd (no port).
server {
    listen 8001 ssl;
    listen [::]:8001 ssl;
    server_name mekesh.work.gd;

    ssl_certificate /etc/letsencrypt/live/mekesh.work.gd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mekesh.work.gd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}
